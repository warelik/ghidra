name: Upstream Plus Packaging

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [downstream]
    paths: ["scripts/**", ".github/workflows/release.yml"]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ ((github.event_name != 'issue_comment' &&
          github.event_name != 'pull_request_target') ||
         (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          ((github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
            github.event.comment.user.type == 'Bot') ||
           (github.event.comment.user.login == 'warelik' &&
            github.event.comment.user.type == 'User' &&
            (contains(github.event.comment.body, '<!-- fork-review-disposition:v1') ||
             contains(github.event.comment.body, '<!-- ghidra-adoption:v1') ||
             contains(github.event.comment.body, '<!-- fork-final-retry:v1'))))) ||
         (github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'downstream' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'repair/'))) &&
        'upstream-plus-packaging' || format('ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select Official Release And Review Exact Packaging
    if: >-
      (github.event_name != 'issue_comment' &&
       github.event_name != 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       ((github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
         github.event.comment.user.type == 'Bot') ||
        (github.event.comment.user.login == 'warelik' &&
         github.event.comment.user.type == 'User' &&
         (contains(github.event.comment.body, '<!-- fork-review-disposition:v1') ||
          contains(github.event.comment.body, '<!-- ghidra-adoption:v1') ||
          contains(github.event.comment.body, '<!-- fork-final-retry:v1'))))) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'downstream' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'repair/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      mode: ${{ steps.select.outputs.mode }}
      reason: ${{ steps.select.outputs.reason }}
      selection: ${{ steps.select.outputs.selection }}
      pr: ${{ steps.select.outputs.pr }}
      review_base: ${{ steps.select.outputs.review_base }}
      repair_pr: ${{ steps.select.outputs.repair_pr }}
      repair_head: ${{ steps.select.outputs.repair_head }}
      followup: ${{ steps.select.outputs.followup }}
      review_pair: ${{ steps.select.outputs.review_pair }}
      review_state: ${{ steps.select.outputs.review_state }}
      candidate_source_sha: ${{ steps.select.outputs.candidate_source_sha }}
      candidate_maintenance_revision: ${{ steps.select.outputs.candidate_maintenance_revision }}
      candidate_id: ${{ steps.select.outputs.candidate_id }}
      trusted_maintenance_revision: ${{ steps.private-source.outputs.revision }}
      reused_run_id: ${{ steps.select.outputs.reused_run_id }}
      reused_run_attempt: ${{ steps.select.outputs.reused_run_attempt }}
      reused_artifact_id: ${{ steps.select.outputs.reused_artifact_id }}
      reused_artifact_name: ${{ steps.select.outputs.reused_artifact_name }}
      artifact_configuration_sha: ${{ steps.select.outputs.artifact_configuration_sha }}
      adoption_bridge: ${{ steps.select.outputs.adoption_bridge }}
      authorization_reason: ${{ steps.select.outputs.authorization_reason }}
      previous_run_id: ${{ steps.select.outputs.previous_run_id }}
      previous_run_attempt: ${{ steps.select.outputs.previous_run_attempt }}
      policy_run_id: ${{ steps.select.outputs.policy_run_id }}
      policy_run_attempt: ${{ steps.select.outputs.policy_run_attempt }}
      policy_workflow_sha: ${{ steps.select.outputs.policy_workflow_sha }}
      policy_reservation_id: ${{ steps.select.outputs.policy_reservation_id }}
      policy_verified: ${{ steps.select.outputs.policy_verified }}
      frozen_candidate: ${{ steps.select.outputs.frozen_candidate }}
      frozen_run_id: ${{ steps.select.outputs.frozen_run_id }}
      frozen_run_attempt: ${{ steps.select.outputs.frozen_run_attempt }}
      private_source_failed: ${{ steps.private-source-result.outputs.failed }}
      private_source_failure_reason: ${{ steps.private-source-result.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read The Exact Private Maintenance Revision
        id: private-source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lock_path = Path("scripts/maintenance.lock.json")
          if lock_path.is_symlink() or not lock_path.is_file():
              raise SystemExit("reviewed private maintenance lock is missing")
          lock = json.loads(lock_path.read_text())
          if (set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or lock.get("schema") != 1 or lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("reviewed private maintenance lock identity is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={lock['revision']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.private-source.outputs.revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Has No Persisted Credential And Record Its Source
        id: verify-private-checkout
        env:
          SOURCE_REVISION: ${{ steps.private-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          config = root / ".git/config"
          keys = subprocess.run(["git", "config", "--file", str(config), "--name-only", "--list"],
                                check=True, capture_output=True, text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("private source revision is malformed")
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify The Pinned Shared Policy Before Controller Use
        id: verify-shared-policy
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; sys.path.insert(0, 'scripts'); from maintenance import load; load()"
      - name: Record Private Maintenance Acquisition Result
        id: private-source-result
        if: always()
        env:
          PRIVATE_SOURCE_FAILED: ${{ steps.private-source.outcome == 'failure' || steps.private-checkout.outcome == 'failure' || steps.verify-private-checkout.outcome == 'failure' || steps.verify-shared-policy.outcome == 'failure' }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source.outcome == 'failure' && 'maintenance-lock-validation' || steps.private-checkout.outcome == 'failure' && 'private-repository-checkout' || steps.verify-private-checkout.outcome == 'failure' && 'private-checkout-verification' || steps.verify-shared-policy.outcome == 'failure' && 'shared-policy-loader' || '' }}
        run: |
          printf 'failed=%s\nreason=%s\n' "$PRIVATE_SOURCE_FAILED" "$PRIVATE_SOURCE_FAILURE_REASON" >> "$GITHUB_OUTPUT"
      - name: Require Trusted Default Branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = refs/heads/downstream
          test "$DEFAULT_BRANCH" = downstream
      - name: Select One Complete Official Release
        id: select
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py prepare-shared "$RUNNER_TEMP/selection.json"
      - name: Report Actual State
        if: always()
        env:
          READY: ${{ steps.select.outputs.ready }}
          MODE: ${{ steps.select.outputs.mode }}
          REASON: ${{ steps.select.outputs.reason }}
          PR: ${{ steps.select.outputs.pr }}
          PRIVATE_SOURCE_FAILED: ${{ steps.private-source-result.outputs.failed }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source-result.outputs.reason }}
        run: |
          {
            echo "### Official Ghidra plus packaging"
            printf '%s\n' "- State: ${MODE:-failed before selection}: ${REASON:-inspect the failed step}"
            printf '%s\n' "- Review accepted: ${READY:-false}"
            if [ -n "$PR" ]; then printf '%s\n' "- Exact-source review PR: #$PR"; fi
            if [ "$PRIVATE_SOURCE_FAILED" = "true" ]; then
              printf '%s\n' "- Private maintenance acquisition failed: ${PRIVATE_SOURCE_FAILURE_REASON:-unknown}"
            fi
            echo "- Application patch set is empty. GitHub does not deploy to the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

  pending:
    name: External Review Or Repair Is Not Verification
    needs: prepare
    if: needs.prepare.outputs.mode == 'waiting'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          echo "::error::Waiting for native Codex review or implementation; no candidate has passed verification."
          exit 1

  policy-check:
    name: >-
      ${{ needs.prepare.outputs.mode == 'policy' && 'Check Ghidra Policy-Only Migration' ||
          needs.prepare.outputs.mode == 'build' && 'Final Ghidra Policy And Regression Checks' ||
          'Check Repair Against Trusted Tests Without Write Credentials' }}
    needs: prepare
    if: >-
      needs.prepare.outputs.ready == 'true' &&
      needs.prepare.outputs.policy_verified != 'true' &&
      (needs.prepare.outputs.mode == 'build' || needs.prepare.outputs.mode == 'policy' ||
       needs.prepare.outputs.mode == 'repair' || needs.prepare.outputs.mode == 'trusted')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      private_source_failed: ${{ steps.private-source-result.outputs.failed }}
      private_source_failure_reason: ${{ steps.private-source-result.outputs.reason }}
    env:
      CONFIGURATION_SHA: ${{ needs.prepare.outputs.candidate_source_sha }}
      SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
      FROZEN_CANDIDATE: ${{ needs.prepare.outputs.frozen_candidate }}
      FROZEN_CONFIGURATION_SHA: ${{ needs.prepare.outputs.candidate_source_sha }}
      FROZEN_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
      FROZEN_RUN_ID: ${{ needs.prepare.outputs.frozen_run_id }}
      FROZEN_RUN_ATTEMPT: ${{ needs.prepare.outputs.frozen_run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.repair_head }}
          path: candidate
          persist-credentials: false
        if: needs.prepare.outputs.mode == 'repair' || needs.prepare.outputs.mode == 'trusted'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate_source_sha }}
          path: candidate
          persist-credentials: false
        if: needs.prepare.outputs.mode == 'build' || needs.prepare.outputs.mode == 'policy'
      - name: Read The Candidate's Exact Private Maintenance Revision
        id: private-source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lock_path = Path("candidate/scripts/maintenance.lock.json")
          if lock_path.is_symlink() or not lock_path.is_file():
              raise SystemExit("reviewed candidate private maintenance lock is missing")
          lock = json.loads(lock_path.read_text())
          if (set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or type(lock.get("schema")) is not int or lock["schema"] != 1
                  or lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("reviewed candidate private maintenance lock identity is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={lock['revision']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.private-source.outputs.revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Has No Persisted Credential And Record Its Source
        id: verify-private-checkout
        env:
          SOURCE_REVISION: ${{ steps.private-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          keys = subprocess.run(["git", "config", "--file", str(root / ".git/config"),
                                 "--name-only", "--list"], check=True, capture_output=True,
                                text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("private source revision is malformed")
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify The Pinned Shared Policy Before Policy Tests
        id: verify-shared-policy
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; from pathlib import Path; sys.path.insert(0, 'trusted/scripts'); from maintenance import load; load(Path('candidate/scripts/maintenance.lock.json'))"
      - name: Record Private Maintenance Acquisition Result
        id: private-source-result
        if: always()
        env:
          PRIVATE_SOURCE_FAILED: ${{ steps.private-source.outcome == 'failure' || steps.private-checkout.outcome == 'failure' || steps.verify-private-checkout.outcome == 'failure' || steps.verify-shared-policy.outcome == 'failure' }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source.outcome == 'failure' && 'maintenance-lock-validation' || steps.private-checkout.outcome == 'failure' && 'private-repository-checkout' || steps.verify-private-checkout.outcome == 'failure' && 'private-checkout-verification' || steps.verify-shared-policy.outcome == 'failure' && 'shared-policy-loader' || '' }}
        run: |
          printf 'failed=%s\nreason=%s\n' "$PRIVATE_SOURCE_FAILED" "$PRIVATE_SOURCE_FAILURE_REASON" >> "$GITHUB_OUTPUT"
      - name: Require This Native Attempt's Trusted Freeze Before Policy Tests
        run: python3 trusted/scripts/release.py check-shared-execution "$GITHUB_WORKSPACE/candidate"
      - name: Run Trusted And Proposed Tests In Read-Only Containers
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 trusted/scripts/release.py check-policy "$GITHUB_WORKSPACE/candidate"

  build:
    name: Build Official Distribution And Prove PyGhidra Persistence
    needs: [prepare, policy-check, land]
    if: >-
      always() && needs.prepare.outputs.ready == 'true' &&
      ((needs.prepare.outputs.mode == 'build' && needs.policy-check.result == 'success') ||
       (needs.prepare.outputs.mode == 'build-policy-current' &&
        needs.prepare.outputs.policy_verified == 'true') ||
       ((needs.prepare.outputs.mode == 'repair' || needs.prepare.outputs.mode == 'trusted') &&
        needs.policy-check.result == 'success' && needs.land.result == 'success' &&
        needs.land.outputs.final_decision == 'allow'))
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      artifact_name: verified-${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      artifact_configuration_sha: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
      artifact_run_id: ${{ github.run_id }}
      artifact_run_attempt: ${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
      SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
      FROZEN_CANDIDATE: ${{ needs.land.outputs.final_candidate || needs.prepare.outputs.frozen_candidate }}
      FROZEN_CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
      FROZEN_CANDIDATE_ID: ${{ needs.land.outputs.candidate_id || needs.prepare.outputs.candidate_id }}
      FROZEN_RUN_ID: ${{ needs.land.outputs.frozen_run_id || needs.prepare.outputs.frozen_run_id }}
      FROZEN_RUN_ATTEMPT: ${{ needs.land.outputs.frozen_run_attempt || needs.prepare.outputs.frozen_run_attempt }}
      ADOPTION_BRIDGE: ${{ needs.land.outputs.adoption_bridge || needs.prepare.outputs.adoption_bridge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
          persist-credentials: false
      - name: Require This Native Attempt's Trusted Freeze Before Image Work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py check-shared-execution "$RUNNER_TEMP/release"
      - name: Build Upstream Container Without Application Patches
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
        run: python3 scripts/release.py build "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Recheck Exact Review And Publish Without Deployment
    needs: [prepare, policy-check, build, land]
    if: >-
      always() && needs.prepare.outputs.ready == 'true' &&
      ((needs.prepare.outputs.mode == 'build' && needs.policy-check.result == 'success' && needs.build.result == 'success') ||
       (needs.prepare.outputs.mode == 'build-policy-current' &&
        needs.prepare.outputs.policy_verified == 'true' && needs.build.result == 'success') ||
       (needs.prepare.outputs.mode == 'reuse') ||
       ((needs.prepare.outputs.mode == 'repair' || needs.prepare.outputs.mode == 'trusted') &&
        needs.policy-check.result == 'success' && needs.land.result == 'success' &&
        (needs.land.outputs.final_decision == 'allow' || needs.land.outputs.final_decision == 'reuse') &&
        (needs.land.outputs.final_decision == 'reuse' || needs.build.result == 'success')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      private_source_failed: ${{ steps.private-source-result.outputs.failed }}
      private_source_failure_reason: ${{ steps.private-source-result.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
          persist-credentials: false
      - name: Read Candidate Private Maintenance Revision
        id: private-source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path("scripts/maintenance.lock.json").read_text())
          if (set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or type(lock.get("schema")) is not int or lock["schema"] != 1
                  or lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("candidate private maintenance lock is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={lock['revision']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.private-source.outputs.revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Has No Persisted Credential And Record Its Source
        id: verify-private-checkout
        env:
          SOURCE_REVISION: ${{ steps.private-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          keys = subprocess.run(["git", "config", "--file", str(root / ".git/config"),
                                 "--name-only", "--list"], check=True, capture_output=True,
                                text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify Candidate Shared Policy Before Publishing
        id: verify-shared-policy
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; sys.path.insert(0, 'scripts'); from maintenance import load; load()"
      - name: Record Private Maintenance Acquisition Result
        id: private-source-result
        if: always()
        env:
          PRIVATE_SOURCE_FAILED: ${{ steps.private-source.outcome == 'failure' || steps.private-checkout.outcome == 'failure' || steps.verify-private-checkout.outcome == 'failure' || steps.verify-shared-policy.outcome == 'failure' }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source.outcome == 'failure' && 'maintenance-lock-validation' || steps.private-checkout.outcome == 'failure' && 'private-repository-checkout' || steps.verify-private-checkout.outcome == 'failure' && 'private-checkout-verification' || steps.verify-shared-policy.outcome == 'failure' && 'shared-policy-loader' || '' }}
        run: |
          printf 'failed=%s\nreason=%s\n' "$PRIVATE_SOURCE_FAILED" "$PRIVATE_SOURCE_FAILURE_REASON" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name || needs.land.outputs.reused_artifact_name || needs.prepare.outputs.reused_artifact_name }}
          run-id: ${{ needs.land.outputs.reused_run_id || needs.prepare.outputs.reused_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Publish Only The Tested Image
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          PREPARE_MODE: ${{ needs.prepare.outputs.mode }}
          LAND_DECISION: ${{ needs.land.outputs.final_decision }}
          ARTIFACT_ID: ${{ needs.land.outputs.reused_artifact_id || needs.prepare.outputs.reused_artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name || needs.land.outputs.reused_artifact_name || needs.prepare.outputs.reused_artifact_name }}
          ARTIFACT_CONFIGURATION_SHA: ${{ needs.build.outputs.artifact_configuration_sha || needs.land.outputs.artifact_configuration_sha || needs.prepare.outputs.artifact_configuration_sha }}
          ARTIFACT_RUN_ID: ${{ needs.build.outputs.artifact_run_id || needs.land.outputs.reused_run_id || needs.prepare.outputs.reused_run_id || github.run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ needs.build.outputs.artifact_run_attempt || needs.land.outputs.reused_run_attempt || needs.prepare.outputs.reused_run_attempt || github.run_attempt }}
          ADOPTION_BRIDGE: ${{ needs.land.outputs.adoption_bridge || needs.prepare.outputs.adoption_bridge }}
          REVIEW_PR: ${{ needs.prepare.outputs.pr }}
          REVIEW_BASE: ${{ needs.prepare.outputs.review_base }}
          REVIEW_PAIR: ${{ needs.prepare.outputs.review_pair }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          ALLOW_CLOSED_REVIEW: ${{ needs.land.outputs.adopted_sha != '' || needs.prepare.outputs.adoption_bridge != '' }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py publish "$GITHUB_WORKSPACE/release"

  land:
    name: Adopt Verified Packaging Changes In The Same Run
    needs: [prepare, policy-check]
    if: >-
      always() && needs.prepare.outputs.ready == 'true' &&
      (needs.policy-check.result == 'success' || needs.prepare.outputs.policy_verified == 'true') &&
      (needs.prepare.outputs.mode == 'repair' || needs.prepare.outputs.mode == 'trusted')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      adopted_sha: ${{ steps.land.outputs.adopted_sha }}
      final_candidate: ${{ steps.land.outputs.final_candidate }}
      final_decision: ${{ steps.land.outputs.final_decision }}
      candidate_id: ${{ steps.land.outputs.candidate_id }}
      frozen_run_id: ${{ steps.land.outputs.frozen_run_id }}
      frozen_run_attempt: ${{ steps.land.outputs.frozen_run_attempt }}
      final_reason: ${{ steps.land.outputs.final_reason }}
      reused_run_id: ${{ steps.land.outputs.reused_run_id }}
      reused_run_attempt: ${{ steps.land.outputs.reused_run_attempt }}
      reused_artifact_id: ${{ steps.land.outputs.reused_artifact_id }}
      reused_artifact_name: ${{ steps.land.outputs.reused_artifact_name }}
      artifact_configuration_sha: ${{ steps.land.outputs.artifact_configuration_sha }}
      adoption_bridge: ${{ steps.land.outputs.adoption_bridge }}
      private_source_failed: ${{ steps.private-source-result.outputs.failed }}
      private_source_failure_reason: ${{ steps.private-source-result.outputs.reason }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        if: needs.prepare.outputs.private_source_failed != 'true'
        with:
          repository: warelik/machine-maintenance
          ref: ${{ needs.prepare.outputs.trusted_maintenance_revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Has No Persisted Credential And Record Its Source
        id: verify-private-checkout
        if: steps.private-checkout.outcome == 'success'
        env:
          SOURCE_REVISION: ${{ needs.prepare.outputs.trusted_maintenance_revision }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          keys = subprocess.run(["git", "config", "--file", str(root / ".git/config"),
                                 "--name-only", "--list"], check=True, capture_output=True,
                                text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify Trusted Shared Policy
        id: verify-shared-policy
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; sys.path.insert(0, 'scripts'); from maintenance import load; load()"
      - name: Record Private Maintenance Acquisition Result
        id: private-source-result
        if: always()
        env:
          PRIVATE_SOURCE_FAILED: ${{ steps.private-checkout.outcome == 'failure' || steps.verify-private-checkout.outcome == 'failure' || steps.verify-shared-policy.outcome == 'failure' }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-checkout.outcome == 'failure' && 'private-repository-checkout' || steps.verify-private-checkout.outcome == 'failure' && 'private-checkout-verification' || steps.verify-shared-policy.outcome == 'failure' && 'shared-policy-loader' || '' }}
        run: |
          printf 'failed=%s\nreason=%s\n' "$PRIVATE_SOURCE_FAILED" "$PRIVATE_SOURCE_FAILURE_REASON" >> "$GITHUB_OUTPUT"
      - name: Adopt The Exact Reviewed And Tested Repair
        id: land
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          REPAIR_HEAD: ${{ needs.prepare.outputs.repair_head }}
          REVIEW_PAIR: ${{ needs.prepare.outputs.review_pair }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py land-shared "$RUNNER_TEMP/land"

  policy-finish:
    name: Finalize Or Recover Verified Policy-Only State
    needs: [prepare, policy-check, land]
    if: >-
      always() && needs.prepare.outputs.ready == 'true' &&
      ((needs.policy-check.result == 'success' &&
        (needs.prepare.outputs.mode == 'policy' || needs.land.outputs.final_decision == 'policy-only')) ||
       needs.prepare.outputs.mode == 'policy-current')
    outputs:
      private_source_failed: ${{ steps.private-source-result.outputs.failed }}
      private_source_failure_reason: ${{ steps.private-source-result.outputs.reason }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.adopted_sha || needs.prepare.outputs.candidate_source_sha || github.sha }}
          persist-credentials: false
      - name: Read The Exact Candidate Private Maintenance Revision
        id: private-source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lock_path = Path("scripts/maintenance.lock.json")
          lock = json.loads(lock_path.read_text())
          if (set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or type(lock.get("schema")) is not int or lock["schema"] != 1
                  or lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("candidate private maintenance lock is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={lock['revision']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.private-source.outputs.revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Credentials And Source Identity
        id: verify-private-checkout
        env:
          SOURCE_REVISION: ${{ steps.private-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          keys = subprocess.run(["git", "config", "--file", str(root / ".git/config"),
                                 "--name-only", "--list"], check=True, capture_output=True,
                                text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify Candidate Loader
        id: verify-shared-policy
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; sys.path.insert(0, 'scripts'); from maintenance import load; load()"
      - name: Record Private Maintenance Acquisition Result
        id: private-source-result
        if: always()
        env:
          PRIVATE_SOURCE_FAILED: ${{ steps.private-source.outcome == 'failure' || steps.private-checkout.outcome == 'failure' || steps.verify-private-checkout.outcome == 'failure' || steps.verify-shared-policy.outcome == 'failure' }}
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source.outcome == 'failure' && 'maintenance-lock-validation' || steps.private-checkout.outcome == 'failure' && 'private-repository-checkout' || steps.verify-private-checkout.outcome == 'failure' && 'private-checkout-verification' || steps.verify-shared-policy.outcome == 'failure' && 'shared-policy-loader' || '' }}
        run: |
          printf 'failed=%s\nreason=%s\n' "$PRIVATE_SOURCE_FAILED" "$PRIVATE_SOURCE_FAILURE_REASON" >> "$GITHUB_OUTPUT"
      - name: Record Successful Policy-Only Migration Without Rebuilding
        if: needs.prepare.outputs.mode == 'policy' || needs.land.outputs.final_decision == 'policy-only'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || github.sha }}
          FINAL_CANDIDATE: ${{ needs.land.outputs.final_candidate }}
          ADOPTION_BRIDGE: ${{ needs.land.outputs.adoption_bridge || needs.prepare.outputs.adoption_bridge }}
          ALLOW_CLOSED_REVIEW: ${{ needs.land.outputs.adopted_sha != '' || needs.prepare.outputs.adoption_bridge != '' }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          REVIEW_PAIR: ${{ needs.prepare.outputs.review_pair }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py complete-policy "$RUNNER_TEMP/policy"
      - name: Recheck And Close An Already Verified Policy-Only Pair
        if: needs.prepare.outputs.mode == 'policy-current'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CONFIGURATION_SHA: ${{ needs.prepare.outputs.candidate_source_sha }}
          FINAL_CANDIDATE: ${{ needs.prepare.outputs.frozen_candidate }}
          ADOPTION_BRIDGE: ${{ needs.prepare.outputs.adoption_bridge }}
          PREPARE_MODE: ${{ needs.prepare.outputs.mode }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          REVIEW_PAIR: ${{ needs.prepare.outputs.review_pair }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          ALLOW_CLOSED_REVIEW: "true"
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py finish-policy-current "$RUNNER_TEMP/policy"
  repair:
    name: Native Codex Repair Or Explicit Bounded Escalation
    needs: [prepare, pending, policy-check, build, publish, land, policy-finish]
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') ||
       (needs.prepare.outputs.mode != 'policy-current' &&
        needs.prepare.outputs.followup == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.land.outputs.adopted_sha || github.sha }}
          persist-credentials: false
      - name: Read Exact Private Maintenance Revision
        id: private-source
        if: >-
          needs.prepare.outputs.private_source_failed != 'true' &&
          needs.policy-check.outputs.private_source_failed != 'true' &&
          needs.publish.outputs.private_source_failed != 'true' &&
          needs.land.outputs.private_source_failed != 'true' &&
          needs.policy-finish.outputs.private_source_failed != 'true'
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          lock_path = Path("scripts/maintenance.lock.json")
          if lock_path.is_symlink() or not lock_path.is_file():
              raise SystemExit("reviewed controller maintenance lock is missing")
          lock = json.loads(lock_path.read_text())
          if (set(lock) != {"schema", "repository", "revision", "module_sha256", "api_version"}
                  or type(lock.get("schema")) is not int or lock["schema"] != 1
                  or lock.get("repository") != "warelik/machine-maintenance"
                  or not re.fullmatch(r"[0-9a-f]{40}", lock.get("revision", ""))
                  or not re.fullmatch(r"[0-9a-f]{64}", lock.get("module_sha256", ""))
                  or type(lock.get("api_version")) is not int or lock["api_version"] != 1):
              raise SystemExit("reviewed controller maintenance lock identity is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={lock['revision']}\n")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: private-checkout
        if: >-
          needs.prepare.outputs.private_source_failed != 'true' &&
          needs.policy-check.outputs.private_source_failed != 'true' &&
          needs.publish.outputs.private_source_failed != 'true' &&
          needs.land.outputs.private_source_failed != 'true' &&
          needs.policy-finish.outputs.private_source_failed != 'true' &&
          steps.private-source.outcome == 'success'
        with:
          repository: warelik/machine-maintenance
          ref: ${{ steps.private-source.outputs.revision }}
          path: maintenance-source
          ssh-key: ${{ secrets.MAINTENANCE_READ_KEY }}
          persist-credentials: false
      - name: Verify Private Checkout Has No Persisted Credential And Record Its Source
        id: verify-private-checkout
        if: steps.private-checkout.outcome == 'success'
        env:
          SOURCE_REVISION: ${{ steps.private-source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path("maintenance-source")
          keys = subprocess.run(["git", "config", "--file", str(root / ".git/config"),
                                 "--name-only", "--list"], check=True, capture_output=True,
                                text=True).stdout.splitlines()
          if any(key.lower() == "core.sshcommand" or key.lower() == "credential.helper"
                 or key.lower().startswith("http.") and key.lower().endswith(".extraheader") for key in keys):
              raise SystemExit("private checkout left authentication in git config")
          revision = os.environ["SOURCE_REVISION"]
          actual = subprocess.run(["git", "-C", str(root), "rev-parse", "HEAD"],
                                  check=True, capture_output=True, text=True).stdout.strip()
          if actual != revision:
              raise SystemExit("private checkout did not resolve the exact lock revision")
          (root / ".maintenance-source.json").write_text(json.dumps(
              {"repository": "warelik/machine-maintenance", "revision": revision},
              sort_keys=True, separators=(",", ":")))
          PY
      - name: Verify Trusted Shared Policy
        id: verify-shared-policy
        if: steps.verify-private-checkout.outcome == 'success'
        env:
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 -B -c "import sys; sys.path.insert(0, 'scripts'); from maintenance import load; load()"
      - name: Report Private Maintenance Acquisition Failure
        if: >-
          always() &&
          (needs.prepare.outputs.private_source_failed == 'true' ||
           needs.policy-check.outputs.private_source_failed == 'true' ||
           needs.publish.outputs.private_source_failed == 'true' ||
           needs.land.outputs.private_source_failed == 'true' ||
           needs.policy-finish.outputs.private_source_failed == 'true' ||
           steps.private-source.outcome == 'failure' ||
           steps.private-checkout.outcome == 'failure' ||
           steps.verify-private-checkout.outcome == 'failure' ||
           steps.verify-shared-policy.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || github.sha }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          PRIVATE_SOURCE_ACQUISITION_FAILED: "true"
          PRIVATE_SOURCE_FAILURE_REASON: ${{ steps.private-source.outcome == 'failure' && 'repair-controller-lock-validation' || needs.prepare.outputs.private_source_failure_reason || needs.policy-check.outputs.private_source_failure_reason || needs.publish.outputs.private_source_failure_reason || needs.land.outputs.private_source_failure_reason || needs.policy-finish.outputs.private_source_failure_reason || 'repair-private-source-acquisition' }}
        run: python3 scripts/release.py repair-shared "$RUNNER_TEMP/repair"
      - name: Request A Real Fix Without Application Patches Or Deployment
        if: >-
          needs.prepare.outputs.private_source_failed != 'true' &&
          needs.policy-check.outputs.private_source_failed != 'true' &&
          needs.publish.outputs.private_source_failed != 'true' &&
          needs.land.outputs.private_source_failed != 'true' &&
          needs.policy-finish.outputs.private_source_failed != 'true' &&
          steps.private-source.outcome == 'success' &&
          steps.private-checkout.outcome == 'success' &&
          steps.verify-private-checkout.outcome == 'success' &&
          steps.verify-shared-policy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
          CONFIGURATION_SHA: ${{ needs.land.outputs.adopted_sha || github.sha }}
          SELECTED_JSON: ${{ needs.prepare.outputs.selection }}
          REVIEW_PR: ${{ needs.prepare.outputs.pr }}
          REVIEW_PAIR: ${{ needs.prepare.outputs.review_pair }}
          REPAIR_PR: ${{ needs.prepare.outputs.repair_pr }}
          POLICY_RUN_ID: ${{ needs.prepare.outputs.policy_run_id }}
          LAND_DECISION: ${{ needs.land.outputs.final_decision }}
          LAND_REASON: ${{ needs.land.outputs.final_reason }}
          PREPARE_MODE: ${{ needs.prepare.outputs.mode }}
          PREPARE_REASON: ${{ needs.prepare.outputs.reason }}
          PREPARE_PREVIOUS_RUN_ID: ${{ needs.prepare.outputs.previous_run_id }}
          PREPARE_PREVIOUS_RUN_ATTEMPT: ${{ needs.prepare.outputs.previous_run_attempt }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          POLICY_RESULT: ${{ needs.policy-check.result }}
          LAND_RESULT: ${{ needs.land.result }}
          FORK_MAINTENANCE_ROOT: ${{ github.workspace }}/maintenance-source
        run: python3 scripts/release.py repair-shared "$RUNNER_TEMP/repair"
